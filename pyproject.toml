[project]
name = "decanat"
version = "0.1.0"
description = "Цифровой деканат будущего — конкурсный концепт (Django-монолит)"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "argon2-cffi>=23.1",
    "django-axes>=9.0.0",
]

[project.optional-dependencies]
# Только для прод-обвязки (Docker, T34): сервер приложений и драйвер Postgres.
prod = [
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]
