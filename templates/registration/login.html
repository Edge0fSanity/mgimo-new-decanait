{% extends "base.html" %}
{% block title %}Вход — Деканат{% endblock %}
{% block content %}
<h1>Вход</h1>
{% if form.errors %}<p class="error">Неверный логин или пароль.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p><label for="id_username">Логин</label><br>{{ form.username }}</p>
  <p><label for="id_password">Пароль</label><br>{{ form.password }}</p>
  <button type="submit">Войти</button>
</form>
{% endblock %}
