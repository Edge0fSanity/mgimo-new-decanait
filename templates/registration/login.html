{% extends "base.html" %}
{% block title %}Вход — Деканат{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" class="student-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% if form.non_field_errors %}<p class="error" role="alert">Неверный логин или пароль.</p>{% endif %}
  <div class="form-field">
    <label for="{{ form.username.id_for_label }}">Логин</label>
    {{ form.username }}
    <div id="id_username_errors">{{ form.username.errors }}</div>
  </div>
  <div class="form-field">
    <label for="{{ form.password.id_for_label }}">Пароль</label>
    {{ form.password }}
    <div id="id_password_errors">{{ form.password.errors }}</div>
  </div>
  <button type="submit" class="button">Войти</button>
</form>
{% endblock %}
